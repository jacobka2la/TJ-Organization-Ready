name: Build Windows TJY Law Installer

on:
  workflow_dispatch:

jobs:
  build-windows-7:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create desktop env
        shell: pwsh
        run: |
          @"
          TJ_SUPABASE_URL=${{ secrets.TJ_SUPABASE_URL }}
          TJ_SUPABASE_ANON_KEY=${{ secrets.TJ_SUPABASE_ANON_KEY }}
          "@ | Set-Content -Path desktop-sync/.env -Encoding utf8

      - name: Install dependencies
        working-directory: desktop-sync
        run: npm install

      - name: Install Windows 7 compatible Electron
        working-directory: desktop-sync
        run: npm install --no-save --save-exact electron@22.3.27 electron-builder@23.6.0

      - name: Build Windows 7 installer
        working-directory: desktop-sync
        run: npx electron-builder --win nsis --x64 --config.productName="TJY Law" --config.win.artifactName="TJY-Law-Windows7-Setup.exe"

      - name: Upload Windows 7 installer
        uses: actions/upload-artifact@v4
        with:
          name: TJY-Law-Windows7-Installer
          path: desktop-sync/dist/*.exe
          if-no-files-found: error
