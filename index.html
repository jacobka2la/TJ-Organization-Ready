<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TJ Organization | Private Legal File Workspace</title>
    <meta name="description" content="TJ Organization is a private, login-only legal file organization workspace for internal TJY Law use." />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta property="og:title" content="TJ Organization | Private Legal File Workspace" />
    <meta property="og:description" content="Private login-only case file organization workspace." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TJ Organization | Private Legal File Workspace" />
    <meta name="twitter:description" content="Private login-only case file organization workspace." />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const SEARCH_ID = "tj-folder-file-search";

        const addFolderSearch = () => {
          if (!window.location.pathname.includes("/folder/")) return;
          if (document.getElementById(SEARCH_ID)) return;

          const uploadLabel = Array.from(document.querySelectorAll("p")).find(
            (node) => node.textContent?.trim() === "Upload files to this folder",
          );
          if (!uploadLabel) return;

          const uploadBox = uploadLabel.closest('[role="button"]');
          if (!uploadBox || !uploadBox.parentElement) return;

          const folderCard = uploadBox.parentElement;
          const searchWrap = document.createElement("div");
          searchWrap.id = SEARCH_ID;
          searchWrap.className =
            "mb-4 flex items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3";
          searchWrap.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <input type="search" aria-label="Search files in this folder" placeholder="Search files in this folder..." class="w-full bg-transparent outline-none" />
          `;

          uploadBox.insertAdjacentElement("afterend", searchWrap);
          const input = searchWrap.querySelector("input");

          const filterFiles = () => {
            const query = input.value.trim().toLowerCase();
            const fileCards = folderCard.querySelectorAll("article");
            fileCards.forEach((card) => {
              const filename =
                card.querySelector("p[title]")?.getAttribute("title") ||
                card.querySelector("p.font-black")?.textContent ||
                "";
              card.style.display =
                !query || filename.toLowerCase().includes(query) ? "" : "none";
            });
          };

          input.addEventListener("input", filterFiles);
        };

        const downloadWithName = async (url, filename) => {
          const response = await fetch(url);
          if (!response.ok) throw new Error("Could not download file.");
          const blob = await response.blob();
          const blobUrl = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = blobUrl;
          anchor.download = filename || "document";
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
        };

        const openPdfTab = (url, filename) => {
          const tab = window.open("", "_blank");
          if (!tab) return;

          const safeFilename = (filename || "Document.pdf").replace(/[<>\"'&]/g, "");
          tab.document.write(`<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>${safeFilename}</title>
  <style>
    html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#f1f5f9}
    body{display:flex;flex-direction:column}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;background:#fff;border-bottom:1px solid #e2e8f0}
    .name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    button{border:0;border-radius:10px;background:#2563eb;color:#fff;padding:10px 16px;font-weight:800;cursor:pointer}
    iframe{flex:1;width:100%;border:0;background:#fff}
  </style>
</head>
<body>
  <div class="bar"><div class="name">${safeFilename}</div><button id="downloadBtn">Download</button></div>
  <iframe src="${url}"></iframe>
  <script>
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      try {
        const response = await fetch(${JSON.stringify(url)});
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = ${JSON.stringify(filename || "Document.pdf")};
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      } catch (error) {
        alert('Could not download this file.');
      }
    });
  <\/script>
</body>
</html>`);
          tab.document.close();
        };

        document.addEventListener(
          "click",
          (event) => {
            const target = event.target instanceof Element ? event.target : null;
            if (!target) return;

            const downloadLink = target.closest("a[download]");
            if (downloadLink) {
              const href = downloadLink.getAttribute("href");
              const filename = downloadLink.getAttribute("download") || "document";
              if (href) {
                event.preventDefault();
                event.stopPropagation();
                void downloadWithName(href, filename).catch(() => {
                  window.open(href, "_blank");
                });
              }
              return;
            }

            if (target.closest("button, a, input, select, textarea")) return;

            const card = target.closest("article[role='button']");
            if (!card) return;

            const iframe = card.querySelector("iframe[src]");
            const filename = card.querySelector("p[title]")?.getAttribute("title") || "Document.pdf";
            const src = iframe?.getAttribute("src");
            if (!src || !filename.toLowerCase().endsWith(".pdf")) return;

            const url = src.split("#")[0];
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            openPdfTab(url, filename);
          },
          true,
        );

        const observer = new MutationObserver(addFolderSearch);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener("popstate", () => setTimeout(addFolderSearch, 0));
        addFolderSearch();
      })();
    </script>
  </body>
</html>
